<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>System & Diagnostics Test — Fard Vault</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="alternate icon" href="/favicon.ico"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080a08;
      --card: #10140f;
      --border: #1f281b;
      --accent: #B4FF39;
      --text: #f0f2ed;
      --muted: #656d61;
      --danger: #ff4d4f;
      --pre-bg: #000000;
      --pre-text: #B4FF39;
    }

    [data-theme="light"] {
      --bg: #f3ede1;
      --card: #ebe3d2;
      --border: #d3c6ab;
      --accent: #286e00;
      --text: #181916;
      --muted: #7c7a6e;
      --danger: #cf1322;
      --pre-bg: #e2d7c3;
      --pre-text: #181916;
    }

    #curtainOverlay {
      position: fixed;
      inset: 0;
      background: #f3ede1;
      transform-origin: top;
      transform: scaleY(0);
      transition: transform 550ms cubic-bezier(0.76, 0, 0.24, 1);
      z-index: 99999;
      pointer-events: none;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      padding: 40px;
      line-height: 1.6;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text);
      font-size: 1.1rem;
      transition: all 0.2s;
    }

    .theme-toggle-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    button.test-btn {
      background: var(--accent);
      color: #080a08;
      border: 1px solid var(--accent);
      padding: 10px 18px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    [data-theme="light"] button.test-btn {
      color: #ffffff;
    }

    button.test-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .result-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .result-box.success { border-color: var(--accent); }
    .result-box.error { border-color: var(--danger); color: var(--danger); }

    pre {
      background: var(--pre-bg);
      color: var(--pre-text);
      padding: 12px;
      border-radius: 6px;
      margin-top: 8px;
      overflow-x: auto;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div id="curtainOverlay" aria-hidden="true"></div>

  <div class="header-row">
    <h1>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="28" height="28" fill="none">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M0 0H14L18 4V18H0V0ZM3 3V15H15V6L12 3H3Z" fill="var(--accent)"/>
        <path d="M5.5 6H12V8.5H8V9.5H11V12H8V15H5.5V6Z" fill="var(--accent)"/>
      </svg>
      System & Diagnostics Test
    </h1>

    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="/" style="color: var(--text); font-size: 0.88rem; text-decoration: none;">&larr; Back to App</a>
      <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle theme">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </div>

  <p style="color: var(--muted); margin-bottom: 24px;">Verify Zero-Knowledge cryptography, Clerk auth, and MongoDB backend connectivity.</p>

  <div class="btn-row">
    <button class="test-btn" onclick="testCrypto()">1. Test Argon2id & AES-256-GCM</button>
    <button class="test-btn" onclick="testClerk()">2. Test Clerk Auth</button>
    <button class="test-btn" onclick="testBackendApi()">3. Test MongoDB Backend API</button>
    <button class="test-btn" onclick="runAll()">Run All Tests</button>
    <a href="https://fard-pw.netlify.app/" target="_blank" rel="noopener noreferrer" style="color: var(--accent); align-self: center; text-decoration: none; font-size: 0.88rem;">Companion Password Generator &rarr;</a>
  </div>

  <div id="results"></div>

  <script src="https://cdn.jsdelivr.net/npm/argon2-browser@1.18.0/dist/argon2-bundled.min.js"></script>
  <script type="module">
    import { deriveKey, generateSalt, encryptData, decryptData } from '/src/lib/crypto.js';
    import { authService } from '/src/lib/auth-service.js';
    import { vaultService } from '/src/lib/vault-service.js';

    // Theme Management with Curtain Animation
    let isTransitioning = false;

    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      applyTheme(savedTheme);
    }

    function applyTheme(theme) {
      const html = document.documentElement;
      const icon = document.getElementById('themeIcon');
      if (theme === 'light') {
        html.setAttribute('data-theme', 'light');
        html.classList.remove('dark');
        if (icon) icon.textContent = '☀️';
      } else {
        html.setAttribute('data-theme', 'dark');
        html.classList.add('dark');
        if (icon) icon.textContent = '🌙';
      }
    }

    window.toggleTheme = function() {
      if (isTransitioning) return;
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      const next = current === 'light' ? 'dark' : 'light';
      const curtain = document.getElementById('curtainOverlay');

      if (!curtain) {
        applyTheme(next);
        localStorage.setItem('theme', next);
        return;
      }

      isTransitioning = true;
      const targetBg = next === 'light' ? '#f3ede1' : '#080a08';
      curtain.style.background = targetBg;
      curtain.style.transformOrigin = 'top';
      curtain.style.transform = 'scaleY(1)';

      setTimeout(() => {
        applyTheme(next);
        localStorage.setItem('theme', next);

        curtain.style.transform = 'scaleY(0)';
        setTimeout(() => {
          isTransitioning = false;
        }, 550);
      }, 450);
    };

    function log(title, text, type = 'info', preData = null) {
      const el = document.getElementById('results');
      const box = document.createElement('div');
      box.className = `result-box ${type}`;
      box.innerHTML = `<strong>[${new Date().toLocaleTimeString()}] ${title}:</strong> ${text}`;
      if (preData) {
        const pre = document.createElement('pre');
        pre.textContent = typeof preData === 'string' ? preData : JSON.stringify(preData, null, 2);
        box.appendChild(pre);
      }
      el.prepend(box);
    }

    window.testCrypto = async function() {
      log('Cryptography', 'Starting Argon2id + AES-256-GCM test...');
      try {
        const salt = generateSalt();
        log('Crypto', `Salt generated: ${salt}`);

        const masterPassword = 'TestSuperSecretMasterPassword123!';
        const start = performance.now();
        const key = await deriveKey(masterPassword, salt);
        const derivationTime = Math.round(performance.now() - start);
        log('Crypto', `Argon2id derivation completed in ${derivationTime}ms. Key bytes: ${key.length}`);

        const secretPayload = {
          service: 'GitHub',
          username: 'octocat',
          password: 'ghp_super_secret_token_1234567890',
          notes: 'Zero knowledge test payload'
        };

        const encrypted = await encryptData(secretPayload, key);
        log('Crypto', 'Encryption successful! Ciphertext generated.', 'success', encrypted);

        const decrypted = await decryptData(encrypted.encrypted_data, encrypted.iv, key);
        if (decrypted.password === secretPayload.password) {
          log('Crypto', 'Decryption round-trip verified! 100% matched.', 'success', decrypted);
        } else {
          log('Crypto', 'Decryption mismatch!', 'error');
        }
      } catch (err) {
        log('Crypto', `Exception: ${err.message}`, 'error');
      }
    };

    window.testClerk = async function() {
      log('Clerk Auth', 'Testing Clerk authentication initialization...');
      try {
        await authService.init();
        const user = authService.getUser();
        if (user) {
          log('Clerk Auth', `Active session found for ${user.email} (ID: ${user.id})`, 'success');
        } else {
          log('Clerk Auth', 'No active session. Ready for login/registration.', 'info');
        }
      } catch (err) {
        log('Clerk Auth', `Error: ${err.message}`, 'error');
      }
    };

    window.testBackendApi = async function() {
      log('MongoDB Backend API', 'Checking /api/keys and /api/vault...');
      try {
        const res = await fetch('/api/keys');
        log('Backend API', `/api/keys status: ${res.status} (${res.statusText})`);
      } catch (err) {
        log('Backend API', `API routes running in local fallback mode: ${err.message}`, 'info');
      }
    };

    window.runAll = async function() {
      document.getElementById('results').innerHTML = '';
      await testCrypto();
      await testClerk();
      await testBackendApi();
    };

    initTheme();
  </script>
</body>
</html>

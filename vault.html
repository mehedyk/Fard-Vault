<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal Vault — Fard Vault</title>
  <meta name="description" content="Your zero-knowledge encrypted password vault."/>
  
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="alternate icon" href="/favicon.ico"/>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-page: #080a08;
      --bg-surface: #10140f;
      --bg-surface-elevated: #151c14;
      --bg-surface-hover: #1b2419;
      --border-subtle: #1f281b;
      --border-strong: #2e3d26;
      --accent: #B4FF39;
      --accent-muted: rgba(180, 255, 57, 0.14);
      --accent-hover: #c4ff59;
      --text-main: #f0f2ed;
      --text-secondary: #9aa196;
      --text-muted: #656d61;
      --danger: #ff4d4f;
      --warning: #ffaa33;
      --font-display: 'Space Grotesk', -apple-system, sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="light"] {
      --bg-page: #f8faf7;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #edf2eb;
      --bg-surface-hover: #e3ebd8;
      --border-subtle: #dbe4d7;
      --border-strong: #b5c7b0;
      --accent: #2e7d00;
      --accent-muted: rgba(46, 125, 0, 0.12);
      --accent-hover: #246300;
      --text-main: #131712;
      --text-secondary: #4b5548;
      --text-muted: #748070;
      --danger: #cf1322;
      --warning: #d46b08;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    /* Layout */
    .vault-app {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
      margin-bottom: 24px;
    }

    .brand-logo-icon {
      width: 26px;
      height: 26px;
    }

    .brand-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .brand-name .slash {
      color: var(--accent);
      margin: 0 2px;
    }

    .vault-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--accent-muted);
      border-radius: 20px;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .nav-section-title {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding: 0 10px;
      text-transform: uppercase;
    }

    .cat-nav {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 24px;
    }

    .cat-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-family: var(--font-body);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .cat-btn:hover {
      background: var(--bg-surface-elevated);
      color: var(--text-main);
    }

    .cat-btn.active {
      background: var(--accent-muted);
      border-color: var(--border-strong);
      color: var(--accent);
      font-weight: 600;
    }

    .cat-count {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      opacity: 0.8;
    }

    /* Security Health Widget */
    .health-widget {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 20px;
    }

    .health-title {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent);
      letter-spacing: 0.06em;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .health-stat {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Sidebar Footer */
    .sidebar-footer {
      border-top: 1px solid var(--border-subtle);
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .backup-btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-sm {
      padding: 7px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      font-weight: 500;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface-elevated);
      color: var(--text-secondary);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-sm:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Main Content Area */
    .main-area {
      padding: 30px 36px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Top Toolbar */
    .top-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      max-width: 480px;
    }

    .search-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 11px 16px 11px 38px;
      color: var(--text-main);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-new-item {
      background: var(--accent);
      color: #080a08;
      border: 1px solid var(--accent);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    [data-theme="light"] .btn-new-item {
      color: #ffffff;
    }

    .btn-new-item:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-lock {
      background: var(--bg-surface);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-lock:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .theme-toggle-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
    }

    .theme-toggle-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Entries Grid */
    .entries-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .entry-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: all 0.2s;
    }

    .entry-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .card-header-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .service-avatar {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--accent);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .service-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.05rem;
      line-height: 1.2;
    }

    .service-cat-pill {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .favorite-toggle {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      transition: color 0.2s;
    }

    .favorite-toggle.is-fav {
      color: #ffaa33;
    }

    .card-field {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .field-text {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .field-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-action-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .icon-action-btn:hover {
      color: var(--accent);
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-subtle);
      padding-top: 10px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .card-actions-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .card-btn:hover { color: var(--accent); }
    .card-btn.delete-btn:hover { color: var(--danger); }

    /* Empty state */
    .empty-state {
      grid-column: 1 / -1;
      padding: 80px 20px;
      text-align: center;
      background: var(--bg-surface);
      border: 1px dashed var(--border-subtle);
      border-radius: 16px;
    }

    .empty-icon {
      font-size: 2.8rem;
      margin-bottom: 16px;
      color: var(--accent);
    }

    .empty-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .empty-desc {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      padding: 12px 18px;
      background: var(--bg-surface);
      border: 1px solid var(--accent);
      color: var(--text-main);
      border-radius: 8px;
      font-size: 0.88rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.error {
      border-color: var(--danger);
      color: var(--danger);
    }

    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 900;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.3rem;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.3rem;
      cursor: pointer;
    }

    .modal-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .modal-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .modal-input {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 0.9rem;
      outline: none;
    }

    .modal-input:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      padding: 16px 24px;
      background: var(--bg-surface-elevated);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    @media (max-width: 860px) {
      .vault-app {
        grid-template-columns: 1fr;
      }
      .sidebar {
        display: none;
      }
      .main-area {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="vault-app">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div>
        <a href="/" class="sidebar-brand">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" class="brand-logo-icon" fill="none">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M0 0H14L18 4V18H0V0ZM3 3V15H15V6L12 3H3Z" fill="var(--accent)"/>
            <path d="M5.5 6H12V8.5H8V9.5H11V12H8V15H5.5V6Z" fill="var(--accent)"/>
          </svg>
          <span class="brand-name">fard<span class="slash">/</span>vault</span>
        </a>

        <div class="vault-status-pill">
          <span class="status-dot"></span>
          <span>UNLOCKED &bull; AES-256-GCM</span>
        </div>

        <div class="nav-section-title">Categories</div>
        <ul class="cat-nav">
          <li>
            <button class="cat-btn active" onclick="setCategory('all')" id="cat-all">
              <span>🗂️ All items</span>
              <span class="cat-count" id="count-all">0</span>
            </button>
          </li>
          <li>
            <button class="cat-btn" onclick="setCategory('favorites')" id="cat-favorites">
              <span>⭐ Favorites</span>
              <span class="cat-count" id="count-favorites">0</span>
            </button>
          </li>
          <li>
            <button class="cat-btn" onclick="setCategory('social')" id="cat-social">
              <span>🌐 Social Media</span>
              <span class="cat-count" id="count-social">0</span>
            </button>
          </li>
          <li>
            <button class="cat-btn" onclick="setCategory('banking')" id="cat-banking">
              <span>💳 Banking</span>
              <span class="cat-count" id="count-banking">0</span>
            </button>
          </li>
          <li>
            <button class="cat-btn" onclick="setCategory('email')" id="cat-email">
              <span>📧 Email</span>
              <span class="cat-count" id="count-email">0</span>
            </button>
          </li>
          <li>
            <button class="cat-btn" onclick="setCategory('work')" id="cat-work">
              <span>💼 Work</span>
              <span class="cat-count" id="count-work">0</span>
            </button>
          </li>
          <li>
            <button class="cat-btn" onclick="setCategory('gaming')" id="cat-gaming">
              <span>🎮 Gaming</span>
              <span class="cat-count" id="count-gaming">0</span>
            </button>
          </li>
          <li>
            <button class="cat-btn" onclick="setCategory('shopping')" id="cat-shopping">
              <span>🛒 Shopping</span>
              <span class="cat-count" id="count-shopping">0</span>
            </button>
          </li>
          <li>
            <button class="cat-btn" onclick="setCategory('other')" id="cat-other">
              <span>📁 Other</span>
              <span class="cat-count" id="count-other">0</span>
            </button>
          </li>
        </ul>

        <!-- Security Health Widget -->
        <div class="health-widget">
          <div class="health-title">VAULT HEALTH</div>
          <div class="health-stat" id="healthStatus">Scanning entries...</div>
        </div>
      </div>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <div class="backup-btn-row">
          <button class="btn-sm" onclick="exportEncryptedVault()" title="Safe encrypted JSON backup">📦 Encrypted</button>
          <button class="btn-sm" onclick="exportPlaintextVault()" title="Export plaintext (warning)">⚠️ Plaintext</button>
        </div>
        <a href="https://fard-pw.netlify.app/" target="_blank" rel="noopener noreferrer" class="btn-sm" style="width: 100%;">
          <span>🎲 Password Generator &rarr;</span>
        </a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-area">
      <!-- Toolbar -->
      <div class="top-toolbar">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchBox" class="search-input" placeholder="Search your vault... (Press '/' to focus)" oninput="handleSearch(this.value)">
        </div>

        <div class="toolbar-actions">
          <button class="btn-new-item" onclick="openAddModal()">
            <span>➕ New password</span>
          </button>
          <button class="btn-lock" onclick="lockVault()" title="Lock vault and clear encryption key from memory">
            <span>🔒 Lock</span>
          </button>
          <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle theme">
            <span id="themeIcon">🌙</span>
          </button>
        </div>
      </div>

      <!-- Credential Cards Grid -->
      <div class="entries-grid" id="entriesContainer">
        <!-- Rendered dynamically -->
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Add / Edit Modal -->
  <div class="modal-backdrop" id="entryModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="modalHeading">Add password</h3>
        <button class="modal-close-btn" onclick="closeModal()">&times;</button>
      </div>

      <form id="entryForm" onsubmit="handleSaveEntry(event)">
        <div class="modal-body">
          <div class="modal-field-group">
            <label class="modal-label" for="entryTitle">Service / Title *</label>
            <input type="text" id="entryTitle" class="modal-input" required placeholder="e.g. GitHub, Google, Netflix">
          </div>

          <div class="modal-field-group">
            <label class="modal-label" for="entryUsername">Username / Email</label>
            <input type="text" id="entryUsername" class="modal-input" placeholder="username or email@example.com">
          </div>

          <div class="modal-field-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <label class="modal-label" for="entryPassword">Password *</label>
              <a href="https://fard-pw.netlify.app/" target="_blank" rel="noopener noreferrer" style="font-size: 0.78rem; color: var(--accent); text-decoration: none;">Generate with Fard &rarr;</a>
            </div>
            <input type="text" id="entryPassword" class="modal-input" required placeholder="Password">
          </div>

          <div class="modal-field-group">
            <label class="modal-label" for="entryUrl">Website URL</label>
            <input type="url" id="entryUrl" class="modal-input" placeholder="https://example.com">
          </div>

          <div class="modal-field-group">
            <label class="modal-label" for="entryCategory">Category</label>
            <select id="entryCategory" class="modal-input">
              <option value="social">🌐 Social Media</option>
              <option value="banking">💳 Banking</option>
              <option value="email">📧 Email</option>
              <option value="work">💼 Work</option>
              <option value="gaming">🎮 Gaming</option>
              <option value="shopping">🛒 Shopping</option>
              <option value="other">📁 Other</option>
            </select>
          </div>

          <div class="modal-field-group">
            <label class="modal-label" for="entryNotes">Notes</label>
            <textarea id="entryNotes" class="modal-input" rows="2" placeholder="Recovery codes, pin, etc."></textarea>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-sm" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-new-item">Save to vault</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/argon2-browser@1.18.0/dist/argon2-bundled.min.js"></script>
  <script type="module">
    import { deriveKey, encryptData, decryptData, isSafeUrl } from '/src/lib/crypto.js';
    import { authService } from '/src/lib/auth-service.js';
    import { vaultService } from '/src/lib/vault-service.js';

    // Global in-memory vault state
    let currentUser = null;
    let encryptionKey = null;
    let allEntries = [];
    let currentCategory = 'all';
    let editingId = null;

    // Secure in-memory decrypted registry
    const entryRegistry = new Map();

    // Theme Management
    function initTheme() {
      const theme = localStorage.getItem('theme') || 'dark';
      applyTheme(theme);
    }

    function applyTheme(theme) {
      const html = document.documentElement;
      const icon = document.getElementById('themeIcon');
      if (theme === 'light') {
        html.setAttribute('data-theme', 'light');
        if (icon) icon.textContent = '☀️';
      } else {
        html.removeAttribute('data-theme');
        if (icon) icon.textContent = '🌙';
      }
    }

    window.toggleTheme = function() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      localStorage.setItem('theme', next);
      applyTheme(next);
    };

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => {
        toast.remove();
      }, 3500);
    }

    // Inactivity Auto-Lock (15 minutes)
    let inactivityTimer;
    function resetInactivity() {
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(() => {
        showToast('Vault auto-locked due to inactivity', 'error');
        lockVault();
      }, 15 * 60 * 1000);
    }
    ['mousemove', 'keydown', 'click', 'scroll'].forEach(evt => {
      window.addEventListener(evt, resetInactivity, { passive: true });
    });

    // Vault Initialization
    async function initVault() {
      await authService.init();
      currentUser = authService.getUser();

      const masterPassword = sessionStorage.getItem('master_password');
      if (!masterPassword || !currentUser) {
        window.location.href = '/login.html';
        return;
      }

      try {
        const salt = await vaultService.getSalt(currentUser.id);
        if (!salt) {
          showToast('Could not load vault salt', 'error');
          return;
        }

        encryptionKey = await deriveKey(masterPassword, salt);
        await refreshEntries();
        resetInactivity();
      } catch (err) {
        console.error('Vault unlock error:', err);
        showToast('Error decrypting vault', 'error');
      }
    }

    async function refreshEntries() {
      try {
        const encryptedList = await vaultService.loadEntries(currentUser.id);
        allEntries = [];
        entryRegistry.clear();

        for (const item of encryptedList) {
          try {
            const dec = await decryptData(item.encrypted_data, item.iv, encryptionKey);
            const full = {
              id: item.id,
              category: item.category || 'other',
              favorite: !!item.favorite,
              created_at: item.created_at,
              ...dec
            };
            allEntries.push(full);
            entryRegistry.set(item.id, full);
          } catch (decErr) {
            console.error('Decryption failed for item:', item.id, decErr);
          }
        }

        updateCategoryCounts();
        updateHealthWidget();
        renderEntries();
      } catch (e) {
        console.error('Failed to load entries:', e);
      }
    }

    function updateCategoryCounts() {
      const counts = { all: allEntries.length, favorites: 0 };
      allEntries.forEach(e => {
        if (e.favorite) counts.favorites++;
        counts[e.category] = (counts[e.category] || 0) + 1;
      });

      document.getElementById('count-all').textContent = counts.all;
      document.getElementById('count-favorites').textContent = counts.favorites;
      ['social', 'banking', 'email', 'work', 'gaming', 'shopping', 'other'].forEach(cat => {
        const el = document.getElementById(`count-${cat}`);
        if (el) el.textContent = counts[cat] || 0;
      });
    }

    function updateHealthWidget() {
      const statusEl = document.getElementById('healthStatus');
      const total = allEntries.length;
      if (total === 0) {
        statusEl.textContent = 'No passwords saved yet';
        return;
      }

      let weak = 0;
      allEntries.forEach(e => {
        if (!e.password || e.password.length < 12) weak++;
      });

      if (weak > 0) {
        statusEl.innerHTML = `<span style="color: var(--danger)">⚠️ ${weak} weak password${weak > 1 ? 's' : ''}</span>`;
      } else {
        statusEl.innerHTML = `<span style="color: var(--accent)">✓ All passwords strong (12+ chars)</span>`;
      }
    }

    function renderEntries() {
      const container = document.getElementById('entriesContainer');
      const searchTerm = document.getElementById('searchBox').value.toLowerCase().trim();

      let filtered = allEntries;
      if (currentCategory === 'favorites') {
        filtered = filtered.filter(e => e.favorite);
      } else if (currentCategory !== 'all') {
        filtered = filtered.filter(e => e.category === currentCategory);
      }

      if (searchTerm) {
        filtered = filtered.filter(e =>
          (e.title && e.title.toLowerCase().includes(searchTerm)) ||
          (e.username && e.username.toLowerCase().includes(searchTerm)) ||
          (e.url && e.url.toLowerCase().includes(searchTerm))
        );
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔐</div>
            <h3 class="empty-title">${searchTerm ? 'No matching passwords' : 'Your vault is empty'}</h3>
            <p class="empty-desc">${searchTerm ? 'Try a different search query' : 'Click "New password" to add your first encrypted credential.'}</p>
            <button class="btn-new-item" onclick="openAddModal()">➕ Add your first password</button>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const initial = (item.title || 'P').slice(0, 2).toUpperCase();
        const safeUrl = isSafeUrl(item.url) ? item.url : null;

        return `
          <div class="entry-card" id="card-${item.id}">
            <div class="card-top">
              <div class="card-header-group">
                <div class="service-avatar">${initial}</div>
                <div>
                  <div class="service-title">${escapeHtml(item.title || 'Untitled')}</div>
                  <div class="service-cat-pill">${escapeHtml(item.category || 'other')}</div>
                </div>
              </div>
              <button class="favorite-toggle ${item.favorite ? 'is-fav' : ''}" onclick="toggleFavorite('${item.id}')" title="Favorite">
                ${item.favorite ? '★' : '☆'}
              </button>
            </div>

            <div class="card-field">
              <span class="field-text">${escapeHtml(item.username || 'No username')}</span>
              <button class="icon-action-btn" onclick="copyText('${escapeHtml(item.username || '')}', 'Username copied!')" title="Copy username">📋</button>
            </div>

            <div class="card-field">
              <span class="field-text" id="pwd-display-${item.id}">••••••••••••</span>
              <div class="field-actions">
                <button class="icon-action-btn" onclick="togglePasswordView('${item.id}')" title="Reveal / hide">👁️</button>
                <button class="icon-action-btn" onclick="copyPassword('${item.id}')" title="Copy password">📋</button>
              </div>
            </div>

            <div class="card-footer">
              <div>
                ${safeUrl ? `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer" style="color: var(--accent); text-decoration: none;">Launch ↗</a>` : '<span>Local credential</span>'}
              </div>
              <div class="card-actions-group">
                <button class="card-btn" onclick="editEntry('${item.id}')">Edit</button>
                <button class="card-btn delete-btn" onclick="deleteEntry('${item.id}')">Delete</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.setCategory = function(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`cat-${cat}`);
      if (activeBtn) activeBtn.classList.add('active');
      renderEntries();
    };

    window.handleSearch = function(val) {
      renderEntries();
    };

    // Keyboard shortcut '/' to search
    window.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        document.getElementById('searchBox').focus();
      }
    });

    window.togglePasswordView = function(id) {
      const item = entryRegistry.get(id);
      if (!item) return;
      const el = document.getElementById(`pwd-display-${id}`);
      if (!el) return;

      if (el.textContent === '••••••••••••') {
        el.textContent = item.password || '';
        el.style.color = 'var(--accent)';
      } else {
        el.textContent = '••••••••••••';
        el.style.color = 'var(--text-secondary)';
      }
    };

    window.copyPassword = function(id) {
      const item = entryRegistry.get(id);
      if (!item || !item.password) return;
      navigator.clipboard.writeText(item.password).then(() => {
        showToast('Password copied to clipboard!');
      });
    };

    window.copyText = function(text, successMsg) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        showToast(successMsg || 'Copied!');
      });
    };

    window.toggleFavorite = async function(id) {
      const item = entryRegistry.get(id);
      if (!item) return;
      const nextFav = !item.favorite;
      item.favorite = nextFav;
      await vaultService.updateEntry(currentUser.id, id, { favorite: nextFav });
      updateCategoryCounts();
      renderEntries();
    };

    window.deleteEntry = async function(id) {
      const item = entryRegistry.get(id);
      const title = item ? item.title : 'this password';
      if (!confirm(`Delete ${title} permanently from your vault?`)) return;

      await vaultService.deleteEntry(currentUser.id, id);
      entryRegistry.delete(id);
      allEntries = allEntries.filter(e => e.id !== id);
      showToast('Password deleted.');
      updateCategoryCounts();
      updateHealthWidget();
      renderEntries();
    };

    // Modal Operations
    window.openAddModal = function() {
      editingId = null;
      document.getElementById('modalHeading').textContent = 'Add password';
      document.getElementById('entryForm').reset();
      document.getElementById('entryModal').style.display = 'flex';
    };

    window.editEntry = function(id) {
      const item = entryRegistry.get(id);
      if (!item) return;

      editingId = id;
      document.getElementById('modalHeading').textContent = 'Edit password';
      document.getElementById('entryTitle').value = item.title || '';
      document.getElementById('entryUsername').value = item.username || '';
      document.getElementById('entryPassword').value = item.password || '';
      document.getElementById('entryUrl').value = item.url || '';
      document.getElementById('entryCategory').value = item.category || 'other';
      document.getElementById('entryNotes').value = item.notes || '';
      document.getElementById('entryModal').style.display = 'flex';
    };

    window.closeModal = function() {
      document.getElementById('entryModal').style.display = 'none';
      editingId = null;
    };

    window.handleSaveEntry = async function(e) {
      e.preventDefault();
      const title = document.getElementById('entryTitle').value.trim();
      const username = document.getElementById('entryUsername').value.trim();
      const password = document.getElementById('entryPassword').value;
      const url = document.getElementById('entryUrl').value.trim();
      const category = document.getElementById('entryCategory').value;
      const notes = document.getElementById('entryNotes').value.trim();

      const sensitivePayload = { title, username, password, url, notes };
      const encrypted = await encryptData(sensitivePayload, encryptionKey);

      if (editingId) {
        await vaultService.updateEntry(currentUser.id, editingId, {
          encrypted_data: encrypted.encrypted_data,
          iv: encrypted.iv,
          category,
          favorite: entryRegistry.get(editingId)?.favorite || false
        });
        showToast('Password updated successfully!');
      } else {
        await vaultService.createEntry(currentUser.id, {
          encrypted_data: encrypted.encrypted_data,
          iv: encrypted.iv,
          category,
          favorite: false
        });
        showToast('Password encrypted & saved!');
      }

      closeModal();
      await refreshEntries();
    };

    // Export Encrypted
    window.exportEncryptedVault = async function() {
      const rawEntries = await vaultService.loadEntries(currentUser.id);
      const salt = await vaultService.getSalt(currentUser.id);
      const blob = new Blob([JSON.stringify({
        version: '2.0',
        exportedAt: new Date().toISOString(),
        salt,
        entries: rawEntries
      }, null, 2)], { type: 'application/json' });

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `fard_vault_encrypted_backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Encrypted backup downloaded!');
    };

    // Export Plaintext (with explicit confirmation)
    window.exportPlaintextVault = function() {
      const confirmed = confirm('⚠️ WARNING: This will export your passwords in PLAIN TEXT!\n\nAnyone who obtains this file will be able to read all your credentials.\n\nAre you sure you want to proceed?');
      if (!confirmed) return;

      const plaintextList = allEntries.map(e => ({
        title: e.title,
        username: e.username,
        password: e.password,
        url: e.url,
        category: e.category,
        notes: e.notes
      }));

      const blob = new Blob([JSON.stringify(plaintextList, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `fard_vault_plaintext_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Plaintext file exported.');
    };

    window.lockVault = function() {
      sessionStorage.removeItem('master_password');
      sessionStorage.removeItem('user_id');
      sessionStorage.removeItem('user_email');
      encryptionKey = null;
      entryRegistry.clear();
      window.location.href = '/login.html';
    };

    initTheme();
    initVault();
  </script>
</body>
</html>
